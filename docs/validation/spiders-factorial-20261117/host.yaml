      cpus:
        - 2
        - 3
      leader-cpu: 3
      data-loops:
        rtc-data-loop:
          - 2
    session:
      cpus:
        - 2
        - 3
      leader-cpu: 3
      data-loops:
        rtc-data-loop:
          - 2
    simulator:
      cpus:
        - 6
        - 7
      leader-cpu: 6
      workers:
