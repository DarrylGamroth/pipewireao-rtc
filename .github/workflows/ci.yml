name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: RTC tests and coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: '3,0'
      OPENBLAS_NUM_THREADS: '1'
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Install native build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build gcovr libglib2.0-dev libjson-c-dev util-linux-extra
      - name: Instantiate the test workspace
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(RegistrySpec(url="https://github.com/DarrylGamroth/PackageRegistry.git"))
            Pkg.instantiate(; workspace=true)'
      - name: Test the RTC and run Aqua
        run: julia --startup-file=no --code-coverage=@ --project=test test/runtests.jl
      - name: Test native RTC controls on disposable PipeWire cores
        run: |
          for selector in control_endpoint control_endpoint_faults media_session_private_core \
              parameter_ndarray_private_core owner_bootstrap_sealed owner_terminal \
              calibration_action_endpoint test_calibration_capture_private_core media_session_process; do
            julia --startup-file=no --code-coverage=@ --project=. "test/$selector.jl"
          done
      - name: Test owner bootstrap and acquisition lifecycle
        run: |
          for selector in owner_bootstrap acquisition_lifecycle_client test_owner_entrypoints; do
            julia --startup-file=no --code-coverage=@ --threads=2,0 --project=. "test/$selector.jl"
          done
      - name: Test calibration responses and native session disconnect
        run: |
          julia --startup-file=no --code-coverage=@ --project=test test/test_simulation_responses.jl
          julia --startup-file=no --code-coverage=@ --threads=1,0 --project=test test/source_control_private_core.jl
          julia --startup-file=no --code-coverage=@ --threads=1,0 --project=test test/parameter_owner_private_core.jl
          julia --startup-file=no --code-coverage=@ --threads=1,0 --project=test test/media_session_host.jl
          julia --startup-file=no --code-coverage=@ --threads=1,0 --project=test test/integration/independent_core_identity.jl
      - name: Test service admission and native Quit against the user manager
        run: |
          uid=$(id -u)
          sudo systemctl start "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          julia --startup-file=no --code-coverage=@ --project=test test/systemd_bus.jl
          RTC_STOP_EVIDENCE_ROOT="$RUNNER_TEMP" julia --startup-file=no --code-coverage=@ --project=test test/systemd_stop.jl
      - name: Install the checked-out RTC and operator CLI from a disposable registry
        run: julia --startup-file=no --code-coverage=@ --project=. test/runtime_install_registry.jl --direct-session runtime-install.info
      - name: Build and test the native management service
        run: |
          meson setup runtime/build runtime -Db_coverage=true -Dbuildtype=debug
          meson compile -C runtime/build
          meson test -C runtime/build --print-errorlogs
          PIPEWIREAO_MANAGEMENT_BINARY="$PWD/runtime/build/pipewireao-management" \
            julia --startup-file=no --code-coverage=@ --project=. test/management_endpoint.jl
          gcovr --root . --filter '^runtime/management\.c$' --lcov management.info runtime/build
          sed -i 's|^SF:.*/runtime/management\.c$|SF:runtime/management.c|' management.info
          grep -Fx 'SF:runtime/management.c' management.info
      - name: Process Julia line coverage
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: core-coverage
          path: |
            lcov.info
            management.info
            runtime-install.info
          if-no-files-found: error
          retention-days: 1

  science:
    name: CPU science integration
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: rtc-science
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      JULIA_LOAD_PATH: "@:@stdlib"
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Select an uncached depot
        run: echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/rtc-science-depot:" >> "$GITHUB_ENV"
      - name: Instantiate science dependencies in the disposable runner
        env:
          RTC_CALIBRATION_DEPLOY_KEY: ${{ secrets.RTC_CALIBRATION_DEPLOY_KEY }}
          RTC_HIL_DEPLOY_KEY: ${{ secrets.RTC_HIL_DEPLOY_KEY }}
          RTC_GRAPH_DEPLOY_KEY: ${{ secrets.RTC_GRAPH_DEPLOY_KEY }}
        run: bash .github/instantiate_science.sh
      - name: Exercise the science extensions on CPU
        run: |
          julia --startup-file=no --code-coverage=@ --threads=4,0 --project=test/science test/science/runtests.jl cold
          julia --startup-file=no --code-coverage=@ --threads=4,1 --project=test/science test/science/runtests.jl private_core
          julia --startup-file=no --code-coverage=@ --threads=3,0 --project=test/science test/science/runtests.jl retained_owner
          julia --startup-file=no --code-coverage=@ --threads=3,0 --project=test/science test/science/runtests.jl physical_offset_inputs
          julia --startup-file=no --code-coverage=@ --threads=4,0 --project=test/science test/science/runtests.jl physical_offsets
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - uses: actions/upload-artifact@v4
        with:
          name: science-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Combined line coverage
    needs: [test, science]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage'
          path: reports
      - name: Merge reports and require project coverage above 90%
        run: julia --startup-file=no .github/check_coverage.jl combined.info reports/core-coverage/*.info reports/science-coverage/lcov.info
      - name: Upload combined line coverage using GitHub OIDC
        if: "!cancelled() && hashFiles('combined.info') != ''"
        uses: codecov/codecov-action@v7
        with:
          files: combined.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
