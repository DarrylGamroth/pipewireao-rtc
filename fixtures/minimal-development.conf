# Standard relaxed SPA-JSON. This fixture is complete-frame and non-actuating.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization

    source = {
        factory = pipewireao.simulated-complete-frame
        module = libpipewire-module-ndarray-filter-chain
        node.name = pipewireao-rtc-source
        plugin.path = "${CALCULON_FGN_BUNDLE}"
        algorithm.label = docrime-excitation-f32
        algorithm.config = {
            amplitudes = [ 1.0 2.0 ]
            seed = 0
        }
        ports = [
            {
                name = excitation
                direction = output
                element-type = F32_LE
                shape = [ 2 ]
                schema = org.calculon.ao.docrime-excitation/1
            }
        ]
    }

    graph = {
        factory = pipewireao.calculon-fgn-native
        module = libpipewire-module-ndarray-filter-chain
        node.name = pipewireao-rtc-graph
        plugin.path = "${CALCULON_FGN_BUNDLE}"
        algorithm.label = leaky-integrator-f32
        algorithm.config = {
            extent = 2
            initial_state = 0.0
            input_schema = org.calculon.ao.docrime-excitation/1
            output_schema = org.calculon.ao.controller-command/1
        }
        ports = [
            {
                name = input
                direction = input
                element-type = F32_LE
                shape = [ 2 ]
                schema = org.calculon.ao.docrime-excitation/1
            }
            {
                name = output
                direction = output
                element-type = F32_LE
                shape = [ 2 ]
                schema = org.calculon.ao.controller-command/1
            }
        ]
    }

    sink = {
        factory = pipewireao.discard-complete-frame
        module = libpipewire-module-ndarray-filter-chain
        node.name = pipewireao-rtc-sink
        plugin.path = "${PIPEWIREAO_NDARRAY_EXAMPLE}"
        algorithm.label = scale-f32
        algorithm.config = {
            shape = [ 2 ]
            schema = org.calculon.ao.controller-command/1
        }
        ports = [
            {
                name = in
                direction = input
                element-type = F32_LE
                shape = [ 2 ]
                schema = org.calculon.ao.controller-command/1
            }
        ]
    }

    properties = {
        graph.gain = 0.5
        graph.pole = 0.75
    }
    parameters = {}
    observations = []
    links = [
        {
            output = "pipewireao-rtc-source:excitation"
            input = "pipewireao-rtc-graph:input"
        }
        {
            output = "pipewireao-rtc-graph:output"
            input = "pipewireao-rtc-sink:in"
        }
    ]
}
