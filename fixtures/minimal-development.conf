# Standard relaxed SPA-JSON. This fixture is complete-frame and non-actuating.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization

    source = {
        factory = api.fits.source
        module = libpipewire-module-spa-node-factory
        node.name = pipewireao-rtc-source
        plugin.path = "${PIPEWIREAO_FITS_PLUGIN}"
        args = {
            api.fits.path = "${PIPEWIREAO_RTC_FITS_PATH}"
            api.fits.hdu = 1
            api.fits.sample-rank = 1
            api.fits.rate = 1000/1
            api.fits.schema = org.calculon.ao.docrime-excitation/1
            api.fits.io-mode = file
            api.fits.prefault = false
            api.fits.loop = true
            api.fits.readiness = timerfd
            api.fits.output-mode = frame
        }
        ports = [
            {
                name = output
                direction = output
                element-type = F32_LE
                shape = [ 2 ]
                schema = org.calculon.ao.docrime-excitation/1
            }
        ]
    }

    graph = {
        factory = pipewireao.calculon-fgn-native
        module = libpipewire-module-ndarray-filter-chain
        node.name = pipewireao-rtc-graph
        plugin.path = "${CALCULON_FGN_BUNDLE}"
        algorithm.label = leaky-integrator-f32
        algorithm.config = {
            extent = 2
            initial_state = 0.0
            input_schema = org.calculon.ao.docrime-excitation/1
            output_schema = org.calculon.ao.controller-command/1
            rate = [ 1000 1 ]
        }
        ports = [
            {
                name = input
                direction = input
                element-type = F32_LE
                shape = [ 2 ]
                schema = org.calculon.ao.docrime-excitation/1
            }
            {
                name = output
                direction = output
                element-type = F32_LE
                shape = [ 2 ]
                schema = org.calculon.ao.controller-command/1
            }
        ]
    }

    sink = {
        factory = api.pipewireao.discard
        module = libpipewire-module-spa-node-factory
        node.name = pipewireao-rtc-sink
        plugin.path = "${PIPEWIREAO_DISCARD_PLUGIN}"
        ports = [
            {
                name = in
                direction = input
                element-type = F32_LE
                shape = [ 2 ]
                schema = org.calculon.ao.controller-command/1
            }
        ]
    }

    properties = {
        graph.gain = 0.5
        graph.pole = 0.75
    }
    parameters = {}
    observations = []
    links = [
        {
            output = "pipewireao-rtc-source:output"
            input = "pipewireao-rtc-graph:input"
        }
        {
            output = "pipewireao-rtc-graph:output"
            input = "pipewireao-rtc-sink:in"
        }
    ]
}
