# Full-frame REVOLT Copper against the same HEART WFS source and demanded-command
# observer used by the matched comparison. The observer does not actuate a DM.
# The delegated FGN module arguments prepare the four calibration parameters
# before the first frame; the RTC links only the repeated data boundary.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization
    rate = 474/1

    sources = [
        {
            ownership = external
            node.name = rtc-heart-wfs-row-source
            ports = [
                { name = output direction = output element-type = U16_LE shape = [ 64 64 ] schema = org.calculon.ao.raw-detector-pixels/1 }
            ]
        }
    ]
    graphs = [
        {
            factory = pipewireao.fgn-native
            module = libpipewire-module-ndarray-filter-chain
            node.name = calculon-revolt-copper-fullframe
            config.path = "${PIPEWIREAO_RTC_GRAPH_COPPER_NATIVE}"
            ports = [
                { name = "calibrate:raw" direction = input element-type = U16_LE shape = [ 64 64 ] schema = org.calculon.ao.raw-detector-pixels/1 }
                { name = "command:demanded" direction = output element-type = F32_LE shape = [ 277 ] schema = org.calculon.ao.demanded-pdm-command/1 }
            ]
        }
    ]
    sinks = [
        {
            ownership = external
            node.name = julia-fits-command-observer
            ports = [
                { name = input_1 direction = input element-type = F32_LE shape = [ 277 ] schema = org.calculon.ao.demanded-pdm-command/1 }
            ]
        }
    ]
    execution-groups = [
        { name = copper-controller nodes = [ calculon-revolt-copper-fullframe ] }
    ]
    properties = {}
    parameters = {}
    observations = []
    links = [
        { output = "rtc-heart-wfs-row-source:output" input = "calculon-revolt-copper-fullframe:calibrate:raw" passive = true }
        { output = "calculon-revolt-copper-fullframe:command:demanded" input = "julia-fits-command-observer:input_1" passive = false }
    ]
}
