{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization
    sources = [
        {
            factory = api.fits.source
            module = libpipewire-module-spa-node-factory
            node.name = pipewireao-rtc-fork-source
            plugin.path = "${PIPEWIREAO_FITS_PLUGIN}"
            args = {
                api.fits.path = "${PIPEWIREAO_RTC_FITS_PATH_FORK}"
                api.fits.hdu = 1 api.fits.sample-rank = 1 api.fits.rate = 1000/1
                api.fits.schema = org.calculon.ao.docrime-excitation/1
                api.fits.io-mode = file api.fits.prefault = false api.fits.loop = true
                api.fits.readiness = timerfd api.fits.output-mode = frame
            }
            ports = [ { name = output direction = output element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.docrime-excitation/1 } ]
        }
    ]
    graphs = [
        {
            factory = pipewireao.calculon-fgn-native module = libpipewire-module-ndarray-filter-chain
            node.name = pipewireao-rtc-fork-graph-a config.path = "${PIPEWIREAO_RTC_GRAPH_FORK_A}"
            ports = [
                { name = input direction = input element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.docrime-excitation/1 }
                { name = output direction = output element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.controller-command-a/1 }
            ]
        }
        {
            factory = pipewireao.calculon-fgn-native module = libpipewire-module-ndarray-filter-chain
            node.name = pipewireao-rtc-fork-graph-b config.path = "${PIPEWIREAO_RTC_GRAPH_FORK_B}"
            ports = [
                { name = input direction = input element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.docrime-excitation/1 }
                { name = output direction = output element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.controller-command-b/1 }
            ]
        }
    ]
    sinks = [
        {
            factory = api.pipewireao.discard module = libpipewire-module-spa-node-factory
            node.name = pipewireao-rtc-fork-sink-a plugin.path = "${PIPEWIREAO_DISCARD_PLUGIN}"
            ports = [ { name = in direction = input element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.controller-command-a/1 } ]
        }
        {
            factory = api.pipewireao.discard module = libpipewire-module-spa-node-factory
            node.name = pipewireao-rtc-fork-sink-b plugin.path = "${PIPEWIREAO_DISCARD_PLUGIN}"
            ports = [ { name = in direction = input element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.controller-command-b/1 } ]
        }
    ]
    properties = {} parameters = {} observations = []
    links = [
        { output = "pipewireao-rtc-fork-source:output" input = "pipewireao-rtc-fork-graph-a:input" }
        { output = "pipewireao-rtc-fork-source:output" input = "pipewireao-rtc-fork-graph-b:input" }
        { output = "pipewireao-rtc-fork-graph-a:output" input = "pipewireao-rtc-fork-sink-a:in" }
        { output = "pipewireao-rtc-fork-graph-b:output" input = "pipewireao-rtc-fork-sink-b:in" }
    ]
}
