# Standard relaxed SPA-JSON. AdaptiveOpticsSim runs in an external application.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization

    sources = [
        {
            ownership = external
            node.name = pipewireao-aos-hil-wfs
            ports = [
                { name = output direction = output element-type = F32_LE shape = [ 64 64 ] schema = org.adaptiveopticssim.hil-reference.shack-hartmann-frame.f32/1 }
            ]
        }
    ]
    graphs = [
        {
            factory = pipewireao.calculon-fgn-native
            module = libpipewire-module-ndarray-filter-chain
            node.name = pipewireao-rtc-aos-controller
            config.path = "${PIPEWIREAO_RTC_GRAPH_AOS_HIL}"
            ports = [
                { name = input direction = input element-type = F32_LE shape = [ 64 64 ] schema = org.adaptiveopticssim.hil-reference.shack-hartmann-frame.f32/1 }
                { name = output direction = output element-type = F32_LE shape = [ 25 ] schema = org.adaptiveopticssim.hil-reference.dm-command-surface-opd-m.f32/1 }
            ]
        }
    ]
    sinks = [
        {
            ownership = external
            node.name = pipewireao-aos-hil-command
            ports = [
                { name = input direction = input element-type = F32_LE shape = [ 25 ] schema = org.adaptiveopticssim.hil-reference.dm-command-surface-opd-m.f32/1 }
            ]
        }
    ]
    execution-groups = [
        { name = controller nodes = [ pipewireao-rtc-aos-controller ] }
    ]
    properties = {}
    parameters = {}
    observations = []
    links = [
        { output = "pipewireao-aos-hil-wfs:output" input = "pipewireao-rtc-aos-controller:input" passive = true }
        { output = "pipewireao-rtc-aos-controller:output" input = "pipewireao-aos-hil-command:input" passive = false }
    ]
}
