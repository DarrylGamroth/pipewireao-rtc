# Common-input REVOLT Classic native/Julia numerical fixture.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization
    rate = 500/1

    sources = [
        {
            ownership = external
            node.name = revolt-classic-sim-wfs
            ports = [
                { name = output_1 direction = output element-type = F32_LE shape = [ 352 352 ] schema = org.revolt.classic.shwfs-frame.f32/1 }
            ]
        }
        {
            factory = pipewireao.runtime-parameter
            node.name = revolt-classic-controller-reconstructor
            ports = [
                { name = output_1 direction = output parameter = true element-type = F32_LE shape = [ 277 376 ] schema = org.calculon.ao.shwfs-reconstructor/1 }
            ]
        }
        {
            factory = pipewireao.runtime-parameter
            node.name = revolt-classic-controller-reconstructor-julia
            ports = [
                { name = output_1 direction = output parameter = true element-type = F32_LE shape = [ 277 376 ] schema = org.calculon.ao.shwfs-reconstructor/1 }
            ]
        }
    ]
    graphs = [
        {
            factory = pipewireao.fgn-native
            module = libpipewire-module-ndarray-filter-chain
            node.name = pipewireao-rtc-revolt-native
            config.path = "${PIPEWIREAO_RTC_GRAPH_REVOLT_NATIVE}"
            ports = [
                { name = "measure:image" direction = input element-type = F32_LE shape = [ 352 352 ] schema = org.revolt.classic.shwfs-frame.f32/1 }
                { name = "reconstruct:reconstructor" direction = input parameter = true element-type = F32_LE shape = [ 277 376 ] schema = org.calculon.ao.shwfs-reconstructor/1 }
                { name = "integrate:output" direction = output element-type = F32_LE shape = [ 277 ] schema = org.revolt.hsdm277.actuator-surface-opd-m.f32/1 }
            ]
        }
        {
            ownership = external
            run-control = session
            node.name = pipewireao-rtc-revolt-julia
            ports = [
                { name = image direction = input element-type = F32_LE shape = [ 352 352 ] schema = org.revolt.classic.shwfs-frame.f32/1 }
                { name = reconstructor direction = input parameter = true element-type = F32_LE shape = [ 277 376 ] schema = org.calculon.ao.shwfs-reconstructor/1 }
                { name = output direction = output element-type = F32_LE shape = [ 277 ] schema = org.revolt.hsdm277.actuator-surface-opd-m.f32/1 }
            ]
        }
    ]
    sinks = [
        {
            ownership = external
            node.name = revolt-classic-sim-hsdm277-command
            ports = [
                { name = input_1 direction = input element-type = F32_LE shape = [ 277 ] schema = org.revolt.hsdm277.actuator-surface-opd-m.f32/1 }
            ]
        }
        {
            ownership = external
            node.name = revolt-classic-sim-hsdm277-command-julia
            ports = [
                { name = input_1 direction = input element-type = F32_LE shape = [ 277 ] schema = org.revolt.hsdm277.actuator-surface-opd-m.f32/1 }
            ]
        }
    ]
    execution-groups = [
        { name = revolt-controllers nodes = [ pipewireao-rtc-revolt-native pipewireao-rtc-revolt-julia ] }
    ]
    properties = {}
    parameters = {
        "pipewireao-rtc-revolt-native:reconstruct:reconstructor" = "${PIPEWIREAO_RTC_PARAMETER_REVOLT}"
        "pipewireao-rtc-revolt-julia:reconstructor" = "${PIPEWIREAO_RTC_PARAMETER_REVOLT}"
    }
    observations = []
    links = [
        { output = "revolt-classic-controller-reconstructor:output_1" input = "pipewireao-rtc-revolt-native:reconstruct:reconstructor" passive = true }
        { output = "revolt-classic-controller-reconstructor-julia:output_1" input = "pipewireao-rtc-revolt-julia:reconstructor" passive = true }
        { output = "revolt-classic-sim-wfs:output_1" input = "pipewireao-rtc-revolt-native:measure:image" passive = true }
        { output = "revolt-classic-sim-wfs:output_1" input = "pipewireao-rtc-revolt-julia:image" passive = true }
        { output = "pipewireao-rtc-revolt-native:integrate:output" input = "revolt-classic-sim-hsdm277-command:input_1" passive = false }
        { output = "pipewireao-rtc-revolt-julia:output" input = "revolt-classic-sim-hsdm277-command-julia:input_1" passive = false }
    ]
}
