# Standard relaxed SPA-JSON. Another application owns the processing graph
# and explicitly grants this RTC session authority to start and pause it.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization

    sources = [
        {
            factory = api.fits.source
            module = libpipewire-module-spa-node-factory
            node.name = pipewireao-rtc-source
            plugin.path = "${PIPEWIREAO_FITS_PLUGIN}"
            args = {
                api.fits.path = "${PIPEWIREAO_RTC_FITS_PATH}"
                api.fits.hdu = 1
                api.fits.sample-rank = 1
                api.fits.rate = 1000/1
                api.fits.schema = org.calculon.ao.docrime-excitation/1
                api.fits.io-mode = file
                api.fits.prefault = false
                api.fits.loop = true
                api.fits.readiness = timerfd
                api.fits.output-mode = frame
            }
            ports = [
                { name = output direction = output element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.docrime-excitation/1 }
            ]
        }
    ]
    graphs = [
        {
            ownership = external
            run-control = session
            node.name = pipewireao-rtc-external-graph
            ports = [
                { name = input direction = input element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.docrime-excitation/1 }
                { name = output direction = output element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.controller-command/1 }
            ]
        }
    ]
    sinks = [
        {
            factory = api.pipewireao.discard
            module = libpipewire-module-spa-node-factory
            node.name = pipewireao-rtc-sink
            plugin.path = "${PIPEWIREAO_DISCARD_PLUGIN}"
            ports = [
                { name = in direction = input element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.controller-command/1 }
            ]
        }
    ]
    execution-groups = [
        {
            name = main
            nodes = [ pipewireao-rtc-source pipewireao-rtc-external-graph pipewireao-rtc-sink ]
        }
    ]
    properties = {}
    parameters = {}
    observations = []
    links = [
        { output = "pipewireao-rtc-source:output" input = "pipewireao-rtc-external-graph:input" passive = false }
        { output = "pipewireao-rtc-external-graph:output" input = "pipewireao-rtc-sink:in" passive = false }
    ]
}
