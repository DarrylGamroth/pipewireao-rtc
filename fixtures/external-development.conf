# Standard relaxed SPA-JSON. Another application owns the source and sink.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization

    sources = [
        {
            ownership = external
            node.name = pipewireao-rtc-external-source
            ports = [
                { name = output_1 direction = output element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.docrime-excitation/1 }
            ]
        }
    ]
    graphs = [
        {
            factory = pipewireao.fgn-native
            module = libpipewire-module-ndarray-filter-chain
            node.name = pipewireao-rtc-graph
            config.path = "${PIPEWIREAO_RTC_GRAPH_MINIMAL}"
            ports = [
                { name = input direction = input element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.docrime-excitation/1 }
                { name = output direction = output element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.controller-command/1 }
            ]
        }
    ]
    sinks = [
        {
            ownership = external
            node.name = pipewireao-rtc-external-sink
            ports = [
                { name = input_1 direction = input element-type = F32_LE shape = [ 2 ] schema = org.calculon.ao.controller-command/1 }
            ]
        }
    ]
    execution-groups = [
        { name = external-path nodes = [ pipewireao-rtc-graph ] }
    ]
    properties = {}
    parameters = {}
    observations = []
    links = [
        { output = "pipewireao-rtc-external-source:output_1" input = "pipewireao-rtc-graph:input" passive = true }
        { output = "pipewireao-rtc-graph:output" input = "pipewireao-rtc-external-sink:input_1" passive = false }
    ]
}
