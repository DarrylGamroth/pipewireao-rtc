# Standard relaxed SPA-JSON. The HEART source, JuliaFilterGraph controller, and
# demanded-command observer are external. The provider owns graph preparation
# and its matched calibration. The RTC owns the reconstructor parameter route.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization
    rate = 474/1

    sources = [
        {
            ownership = external
            node.name = rtc-heart-wfs-row-source
            ports = [
                { name = output direction = output element-type = U16_LE shape = [ 64 64 ] schema = org.calculon.ao.raw-detector-pixels/1 }
            ]
        }
        {
            factory = pipewireao.runtime-parameter
            node.name = rtc-copper-reconstructor
            ports = [
                { name = output_1 direction = output parameter = true element-type = F32_LE shape = [ 253 3600 ] schema = org.calculon.ao.pwfs-reconstructor/1 }
            ]
        }
    ]
    graphs = [
        {
            ownership = external
            run-control = session
            node.name = calculon-revolt-copper-fullframe
            ports = [
                { name = raw direction = input element-type = U16_LE shape = [ 64 64 ] schema = org.calculon.ao.raw-detector-pixels/1 }
                { name = reconstructor direction = input parameter = true element-type = F32_LE shape = [ 253 3600 ] schema = org.calculon.ao.pwfs-reconstructor/1 }
                { name = demanded direction = output element-type = F32_LE shape = [ 277 ] schema = org.calculon.ao.demanded-pdm-command/1 }
            ]
        }
    ]
    sinks = [
        {
            ownership = external
            node.name = julia-fits-command-observer
            ports = [
                { name = input_1 direction = input element-type = F32_LE shape = [ 277 ] schema = org.calculon.ao.demanded-pdm-command/1 }
            ]
        }
    ]
    execution-groups = [
        { name = copper-controller nodes = [ calculon-revolt-copper-fullframe ] }
    ]
    properties = {}
    parameters = {
        "calculon-revolt-copper-fullframe:reconstructor" = "${PIPEWIREAO_RTC_PARAMETER_COPPER_RECONSTRUCTOR}"
    }
    observations = []
    links = [
        { output = "rtc-copper-reconstructor:output_1" input = "calculon-revolt-copper-fullframe:reconstructor" passive = true }
        { output = "rtc-heart-wfs-row-source:output" input = "calculon-revolt-copper-fullframe:raw" passive = true }
        { output = "calculon-revolt-copper-fullframe:demanded" input = "julia-fits-command-observer:input_1" passive = false }
    ]
}
