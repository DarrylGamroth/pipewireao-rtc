# Standard relaxed SPA-JSON. The deterministic test process owns both endpoints
# and the Julia process owns the ordinary FilterGraphPipeWire processing node.
{
    profile = development
    execution = complete-frame
    authority = none
    claim = development-characterization
    rate = 1000/1

    sources = [
        {
            ownership = external
            node.name = pipewireao-rtc-latest-hold-primary-source
            ports = [
                { name = output_1 direction = output element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.primary/1 }
            ]
        }
        {
            ownership = external
            node.name = pipewireao-rtc-latest-hold-slow-source
            ports = [
                { name = output_1 direction = output element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.slow/1 rate = 100/1 }
            ]
        }
    ]
    graphs = [
        {
            factory = api.ndarray.latest-hold
            module = libpipewire-module-spa-node-factory
            node.name = pipewireao-rtc-latest-hold
            plugin.path = "${PIPEWIREAO_NDARRAY_PLUGIN}"
            args = {
                api.ndarray.element-type = F32_LE
                api.ndarray.shape = [ 2 ]
                api.ndarray.layout = row-major
                api.ndarray.schema = org.pipewireao.rtc.latest-hold.slow/1
                api.ndarray.input-rate = 100/1
                api.ndarray.output-rate = 1000/1
                api.ndarray.max-hold-cycles = 10
            }
            ports = [
                { name = input_1 direction = input element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.slow/1 rate = 100/1 }
                { name = output_1 direction = output element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.slow/1 }
            ]
        }
        {
            ownership = external
            run-control = session
            node.name = pipewireao-rtc-latest-hold-graph
            ports = [
                { name = primary direction = input element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.primary/1 }
                { name = held direction = input element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.slow/1 }
                { name = output direction = output element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.primary/1 }
            ]
        }
    ]
    sinks = [
        {
            ownership = external
            node.name = pipewireao-rtc-latest-hold-observer
            ports = [
                { name = input_1 direction = input element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.slow/1 }
            ]
        }
        {
            ownership = external
            node.name = pipewireao-rtc-latest-hold-command-sink
            ports = [
                { name = input_1 direction = input element-type = F32_LE shape = [ 2 ] schema = org.pipewireao.rtc.latest-hold.primary/1 }
            ]
        }
    ]
    execution-groups = [
        { name = hold nodes = [ pipewireao-rtc-latest-hold pipewireao-rtc-latest-hold-graph ] }
    ]
    properties = {}
    parameters = {}
    observations = []
    links = [
        { output = "pipewireao-rtc-latest-hold-primary-source:output_1" input = "pipewireao-rtc-latest-hold-graph:primary" passive = true }
        { output = "pipewireao-rtc-latest-hold-slow-source:output_1" input = "pipewireao-rtc-latest-hold:input_1" passive = true }
        { output = "pipewireao-rtc-latest-hold:output_1" input = "pipewireao-rtc-latest-hold-observer:input_1" passive = false }
        { output = "pipewireao-rtc-latest-hold:output_1" input = "pipewireao-rtc-latest-hold-graph:held" passive = false }
        { output = "pipewireao-rtc-latest-hold-graph:output" input = "pipewireao-rtc-latest-hold-command-sink:input_1" passive = false }
    ]
}
